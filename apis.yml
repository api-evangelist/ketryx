aid: ketryx
name: Ketryx
description: >-
  Ketryx is an AI-native application lifecycle management (ALM) and compliance
  platform for regulated medical-device and life-sciences software teams. It
  integrates with developer tools such as Jira and GitHub to automate the
  documentation, traceability, and quality-management work required by FDA, EU
  MDR, ISO 13485, ISO 14971, and IEC 62304, keeping teams continuously
  audit-ready. Capabilities include automated Design and Development File
  generation, requirement-risk-code-test traceability, agentic AI for
  repetitive compliance tasks, ISO 14971 risk management, software
  bill-of-materials (SBOM) and vulnerability tracking, QMS enforcement, and
  change-impact assessment. Ketryx exposes a public Build API that lets CI/CD
  pipelines report builds, JUnit / Cucumber test results, build artifacts, and
  CycloneDX / SPDX SBOM documents into a project, via a first-party GitHub
  Action and Python utility. The company is backed by Lightspeed Venture
  Partners.
